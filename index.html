
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XNAME – Оверсайз одяг з України | xname.com.ua</title>
    <meta name="description" content="Офіційний магазин XNAME. Оверсайз одяг для жінок. Доставка по Україні.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Quicksand:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #4f4f4d;
            --surface: #211E1A;
            --ink: #EDE7DB;
            --muted: #948C7C;
            --line: #38342C;
            --accent: #B99B5B;
            --accent-soft: #2B2721;
            --font-display: 'Bodoni Moda', serif;
            --font-logo: 'Quicksand', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-body);
            font-weight: 300;
            line-height: 1.6;
            padding-bottom: 100px;
        }

        .container { max-width: 860px; margin: 0 auto; padding: 0 28px; }

        /* ---------- Header ---------- */
        header {
            padding: 42px 0 24px;
            text-align: center;
        }

        .logo-lockup {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-img {
            height: 108px;
            width: auto;
            display: block;
        }

        .subtitle {
            font-family: var(--font-body);
            font-weight: 500;
            color: #000;
            font-size: 12px;
            margin-top: 8px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* ---------- Categories ---------- */
        .categories {
            display: flex;
            gap: 28px;
            justify-content: center;
            overflow-x: auto;
            padding: 22px 0 20px;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            margin-bottom: 30px;
        }

        .cat-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-family: var(--font-body);
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            white-space: nowrap;
            padding: 4px 0;
            position: relative;
            transition: color 0.2s;
        }

        .cat-btn::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: -3px;
            height: 1px;
            background: var(--ink);
            transform: scaleX(0);
            transition: transform 0.2s;
        }

        .cat-btn.active, .cat-btn:hover { color: var(--ink); }
        .cat-btn.active::after { transform: scaleX(1); }

        .subcategories-wrap {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .subcategories {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 18px 0 8px;
        }

        .subcat-btn {
            background: none;
            border: 1px solid var(--line);
            color: var(--muted);
            font-family: var(--font-body);
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            white-space: nowrap;
            padding: 7px 14px;
            transition: 0.2s;
        }

        .subcat-btn.active, .subcat-btn:hover {
            color: var(--bg);
            background: var(--ink);
            border-color: var(--ink);
        }

        /* ---------- Product grid ---------- */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 48px 32px;
        }

        @media (max-width: 560px) {
            header { padding: 32px 0 18px; }
            .products-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 12px; }
            .logo-img { height: 66px; }
            .categories { justify-content: flex-start; gap: 12px; padding: 18px 4px 16px; margin-bottom: 22px; }
            .product-img-wrap { margin-bottom: 10px; }
            .product-info { gap: 4px; }
            .product-title { font-size: 12px; line-height: 1.35; }
            .product-price { font-size: 11px; }
        }

        .product-card {
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .product-img-wrap {
            width: 100%;
            aspect-ratio: 3 / 4;
            overflow: hidden;
            background: var(--surface);
            margin-bottom: 18px;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: saturate(0.9) contrast(1.02);
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-img { transform: scale(1.03); }

        .product-info { display: flex; flex-direction: column; gap: 10px; }

        .product-title {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .product-price {
            font-size: 13px;
            font-weight: 300;
            color: var(--muted);
            letter-spacing: 0.5px;
        }

        .size-row {
            display: flex;
            gap: 14px;
            margin-top: 4px;
        }

        .size-chip {
            background: none;
            border: none;
            border-bottom: 1px solid transparent;
            color: var(--muted);
            font-family: var(--font-body);
            font-size: 12px;
            letter-spacing: 0.5px;
            padding: 2px 0;
            cursor: pointer;
        }

        .size-chip.selected { color: var(--ink); border-bottom-color: var(--ink); }

        .btn-add {
            margin-top: 14px;
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--ink);
            padding: 12px;
            font-family: var(--font-body);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }

        .btn-add:hover:not(:disabled) { background: var(--ink); color: var(--surface); }
        .btn-add:disabled { opacity: 0.35; cursor: not-allowed; border-color: var(--muted); color: var(--muted); }
        .btn-add.added { background: var(--accent); color: var(--bg); border-color: var(--accent); }

        /* ---------- Product detail page ---------- */
        #productView { display: none; }

        .back-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-family: var(--font-body);
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            padding: 24px 0 20px;
            transition: color 0.2s;
        }

        .back-btn:hover { color: var(--ink); }

        .gallery {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            max-width: 480px;
            margin: 0 auto;
            overflow: hidden;
            background: var(--surface);
            touch-action: pan-y;
        }

        .gallery-track {
            display: flex;
            height: 100%;
            transition: transform 0.35s ease;
        }

        .gallery-slide {
            min-width: 100%;
            height: 100%;
        }

        .gallery-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(25,23,20,0.55);
            border: none;
            color: var(--ink);
            width: 34px;
            height: 34px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-arrow.prev { left: 10px; }
        .gallery-arrow.next { right: 10px; }

        .gallery-dots {
            display: flex;
            justify-content: center;
            gap: 7px;
            margin-top: 14px;
        }

        .gallery-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--line);
            cursor: pointer;
            transition: background 0.2s;
        }

        .gallery-dot.active { background: var(--accent); }

        .pdp-info {
            max-width: 480px;
            margin: 32px auto 0;
        }

        .pdp-title {
            font-family: var(--font-display);
            font-size: 26px;
            font-weight: 400;
        }

        .pdp-sku { font-size: 11px; color: var(--muted); letter-spacing: 0.5px; margin-top: 6px; }
        .pdp-price { font-size: 18px; color: var(--accent); margin-top: 14px; letter-spacing: 0.5px; }

        .pdp-size-label {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 26px 0 10px;
        }

        .pdp-size-row { display: flex; gap: 16px; flex-wrap: wrap; }

        .pdp-add-note {
            font-size: 12px;
            color: var(--muted);
            margin-top: 10px;
            min-height: 16px;
        }

        .accordion { max-width: 480px; margin: 40px auto 0; border-top: 1px solid var(--line); }

        .accordion-item { border-bottom: 1px solid var(--line); }

        .accordion-header {
            width: 100%;
            background: none;
            border: none;
            color: var(--ink);
            font-family: var(--font-body);
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 18px 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .accordion-icon {
            font-size: 16px;
            color: var(--muted);
            transition: transform 0.25s ease;
            font-weight: 300;
        }

        .accordion-item.open .accordion-icon { transform: rotate(45deg); }

        .accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .accordion-body-inner {
            padding: 0 2px 20px;
            font-size: 13px;
            color: var(--muted);
            line-height: 1.7;
        }

        .size-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            font-size: 12px;
        }

        .size-table th, .size-table td {
            text-align: left;
            padding: 7px 8px;
            border-bottom: 1px solid var(--line);
        }

        .size-table th { color: var(--ink); font-weight: 400; letter-spacing: 0.5px; }

        /* ---------- Cart bar ---------- */
        .cart-bar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 820px;
            background: var(--ink);
            color: var(--surface);
            padding: 18px 26px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 14px 30px rgba(0,0,0,0.18);
            cursor: pointer;
            z-index: 100;
        }

        .cart-bar-left { font-size: 12px; letter-spacing: 0.5px; }
        .cart-bar-right { display: flex; align-items: center; gap: 20px; }
        .cart-total { font-size: 13px; letter-spacing: 0.5px; }
        .cart-bar-btn {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 1px solid var(--surface);
            padding-bottom: 2px;
        }

        /* ---------- Modal ---------- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(38,36,32,0.55);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 200;
        }

        .modal-content {
            background: var(--surface);
            width: 100%;
            max-width: 600px;
            padding: 36px 32px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 26px;
        }

        .modal-header h3 {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--ink);
            font-size: 22px;
            font-weight: 300;
            cursor: pointer;
            line-height: 1;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--line);
            font-size: 13px;
        }

        .cart-item-meta { color: var(--muted); font-size: 11px; letter-spacing: 0.3px; margin-top: 3px; }
        .cart-item-remove {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 17px;
            font-weight: 300;
            cursor: pointer;
            padding: 0 4px;
        }
        .cart-item-remove:hover { color: var(--ink); }

        .cart-empty {
            font-size: 12px;
            letter-spacing: 0.5px;
            color: var(--muted);
            padding: 24px 0;
            text-align: center;
        }

        .form-group { margin-bottom: 16px; }

        .form-group label {
            display: block;
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px 2px;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--line);
            color: var(--ink);
            font-size: 14px;
            font-family: var(--font-body);
        }

        .form-control:focus { outline: none; border-bottom-color: var(--ink); }

        .payment-note {
            margin-top: 20px;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.3px;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--ink);
            color: var(--surface);
            border: none;
            font-size: 12px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 24px;
            transition: 0.2s;
        }

        .btn-submit:hover:not(:disabled) { background: var(--accent); }
        .btn-submit:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
    </style>
</head>

                description: 'Світшот вільного крою з воланом та затяжками знизу. Жіночна альтернатива класичному оверсайзу.',
                composition: '80% бавовна, 20% поліестер. Щільність тканини 320 г/м².',
                care: 'Прання при 30°C, не відбілювати, прасувати з виворотної сторони.',
                sizeChart: [
                    { size: 'S', chest: '57', length: '64' },
                    { size: 'M', chest: '60', length: '66' },
                    { size: 'L', chest: '63', length: '68' }
                ]

        let cart = [];
        const selectedSizes = {};
        let currentProduct = null;
        let galleryIndex = 0;
        let galleryTouchStartX = null;
        let activeMain = 'all';
        let activeSub = null;

        const SUBTYPE_LABELS = {
            hoodie: 'Худі',
            pants: 'Штани',
            suit: 'Костюми',
            tshirt: 'Футболки',
            sweatshirt: 'Світшоти',
            joggers: 'Джогери',
            shorts: 'Шорти',
            dress: 'Плаття',
            tank: 'Майки',
            leggings: 'Легінси',
            longsleeve: 'Лонгслів',
            new: 'Нью'
        };

        const sectionConfig = {
            men: { subtypes: ['hoodie', 'pants', 'suit', 'tshirt', 'sweatshirt', 'joggers', 'shorts'] },
            women: { subtypes: ['hoodie', 'pants', 'suit', 'tshirt', 'sweatshirt', 'joggers', 'shorts', 'dress', 'tank', 'leggings'] },
            all: { subtypes: [] },
            new: { subtypes: [] },
            sale: { subtypes: [] }
        };

        function getFilteredProducts() {
            let list = products;

            if (activeMain === 'men' || activeMain === 'women') {
                list = list.filter(p => p.gender === activeMain);
            } else if (activeMain === 'new') {
                list = list.filter(p => p.isNew);
            } else if (activeMain === 'sale') {
                list = list.filter(p => p.isSale);
            }

            if (activeSub) {
                if (activeSub === 'new') {
                    list = list.filter(p => p.isNew);
                } else {
                    list = list.filter(p => p.subtype === activeSub);
                }
            }

            return list;
        }

        function renderProducts() {
            const container = document.getElementById('productsGrid');
            const filtered = getFilteredProducts();

            if (filtered.length === 0) {
                container.innerHTML = '<div class="cart-empty" style="grid-column: 1 / -1;">Товарів у цьому розділі поки немає</div>';
                return;
            }

            container.innerHTML = filtered.map(product => `
                <div class="product-card" onclick="openProduct('${product.id}')">
                    <div class="product-img-wrap">
                        <img src="${product.images[0]}" class="product-img" alt="${product.title}">
                    </div>
                    <div class="product-info">
                        <div class="product-title">${product.title}</div>
                        <div class="product-price">${product.price} грн</div>
                    </div>
                </div>
            `).join('');
        }

        function renderSubcategories() {
            const wrap = document.getElementById('subcategoriesWrap');
            const container = document.getElementById('subcategories');
            const subtypes = sectionConfig[activeMain].subtypes;

            if (subtypes.length === 0) {
                wrap.style.maxHeight = '0';
                container.innerHTML = '';
                return;
            }

            container.innerHTML = subtypes.map(key => `
                <button type="button" class="subcat-btn${activeSub === key ? ' active' : ''}" data-sub="${key}">${SUBTYPE_LABELS[key]}</button>
            `).join('');

            wrap.style.maxHeight = container.scrollHeight + 40 + 'px';
        }

        function selectMain(btn, cat) {
            activeMain = cat;
            activeSub = null;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderSubcategories();
            renderProducts();
        }

        document.getElementById('categories').addEventListener('click', (e) => {
            const btn = e.target.closest('.cat-btn');
            if (!btn) return;
            selectMain(btn, btn.dataset.cat);
        });

        document.getElementById('subcategories').addEventListener('click', (e) => {
            const btn = e.target.closest('.subcat-btn');
            if (!btn) return;
            const key = btn.dataset.sub;
            activeSub = activeSub === key ? null : key;
            renderSubcategories();
            renderProducts();
        });

        /* ---------- Product detail page ---------- */

        function openProduct(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            currentProduct = product;
            galleryIndex = 0;

            document.getElementById('catalogContainer').style.display = 'none';
            document.getElementById('cartBar').style.display = 'none';
            document.getElementById('productView').style.display = 'block';
            window.scrollTo(0, 0);

            document.getElementById('pdpTitle').textContent = product.title;
            document.getElementById('pdpSku').textContent = product.sku;
            document.getElementById('pdpPrice').textContent = `${product.price} грн`;

            renderGallery();

            const sizesHtml = product.sizes.map(s =>
                `<button type="button" class="size-chip" data-size="${s}" onclick="selectPdpSize('${s}')">${s}</button>`
            ).join('');
            document.getElementById('pdpSizes').innerHTML = sizesHtml;

            const addBtn = document.getElementById('pdpAddBtn');
            addBtn.disabled = true;
            addBtn.textContent = 'Оберіть розмір';
            addBtn.classList.remove('added');
            addBtn.onclick = addPdpToCart;
            document.getElementById('pdpNote').textContent = '';

            renderAccordion(product);
        }

        function closeProduct() {
            document.getElementById('productView').style.display = 'none';
            document.getElementById('catalogContainer').style.display = 'block';
            updateCartUI();
        }

        function renderGallery() {
            const track = document.getElementById('galleryTrack');
            const dots = document.getElementById('galleryDots');
            track.innerHTML = currentProduct.images.map(src =>
                `<div class="gallery-slide"><img src="${src}" alt="${currentProduct.title}"></div>`
            ).join('');

            if (currentProduct.images.length > 1) {
                dots.innerHTML = currentProduct.images.map((_, i) =>
                    `<div class="gallery-dot${i === 0 ? ' active' : ''}" onclick="galleryGoTo(${i})"></div>`
                ).join('');
            } else {
                dots.innerHTML = '';
            }

            document.querySelectorAll('.gallery-arrow').forEach(a => {
                a.style.display = currentProduct.images.length > 1 ? 'flex' : 'none';
            });

            updateGalleryPosition();
        }

        function updateGalleryPosition() {
            const track = document.getElementById('galleryTrack');
            track.style.transform = `translateX(-${galleryIndex * 100}%)`;
            document.querySelectorAll('.gallery-dot').forEach((d, i) => {
                d.classList.toggle('active', i === galleryIndex);
            });
        }

        function galleryStep(dir) {
            const total = currentProduct.images.length;
            galleryIndex = (galleryIndex + dir + total) % total;
            updateGalleryPosition();
        }

        function galleryGoTo(i) {
            galleryIndex = i;
            updateGalleryPosition();
        }

        document.getElementById('gallery').addEventListener('touchstart', event => {
            if (currentProduct?.images.length > 1) {
                galleryTouchStartX = event.changedTouches[0].clientX;
            }
        }, { passive: true });

        document.getElementById('gallery').addEventListener('touchend', event => {
            if (galleryTouchStartX === null) return;

            const distance = event.changedTouches[0].clientX - galleryTouchStartX;
            galleryTouchStartX = null;

            if (Math.abs(distance) >= 40) {
                galleryStep(distance < 0 ? 1 : -1);
            }
        }, { passive: true });

        function selectPdpSize(size) {
            selectedSizes[currentProduct.id] = size;
            document.querySelectorAll('#pdpSizes .size-chip').forEach(chip => {
                chip.classList.toggle('selected', chip.dataset.size === size);
            });
            const btn = document.getElementById('pdpAddBtn');
            btn.disabled = false;
            btn.textContent = 'У кошик';
        }

        function addPdpToCart() {
            const size = selectedSizes[currentProduct.id];
            if (!size) return;
            cart.push({ ...currentProduct, size });

            const btn = document.getElementById('pdpAddBtn');
            btn.classList.add('added');
            btn.textContent = 'Додано';
            document.getElementById('pdpNote').textContent = 'Товар додано в кошик';
            setTimeout(() => { btn.classList.remove('added'); btn.textContent = 'У кошик'; }, 900);

            updateCartUI();
        }

        function renderAccordion(product) {
            const sections = [
                { title: 'Опис', content: `<p>${product.description}</p>` },
                { title: 'Склад та якість', content: `<p>${product.composition}</p>` },
                { title: 'Розмірна сітка', content: buildSizeTable(product.sizeChart) },
                { title: 'Доставка', content: '<p>Доставка здійснюється по Україні. Терміни та вартість залежать від обраного способу доставки.</p>' },
                { title: 'Повернення', content: '<p>Повернення або обмін можливі відповідно до законодавства України за умови збереження товарного вигляду та комплектності.</p>' }
            ];

            document.getElementById('pdpAccordion').innerHTML = sections.map((s, i) => `
                <div class="accordion-item${i === 0 ? ' open' : ''}">
                    <button class="accordion-header" onclick="toggleAccordion(this)">
                        <span>${s.title}</span>
                        <span class="accordion-icon">+</span>
                    </button>
                    <div class="accordion-body" style="max-height: ${i === 0 ? '400px' : '0'};">
                        <div class="accordion-body-inner">${s.content}</div>
                    </div>
                </div>
            `).join('');
        }

        function buildSizeTable(rows) {
            const trs = rows.map(r => `<tr><td>${r.size}</td><td>${r.chest} см</td><td>${r.length} см</td></tr>`).join('');
            return `<table class="size-table">
                <thead><tr><th>Розмір</th><th>Обхват грудей</th><th>Довжина виробу</th></tr></thead>
                <tbody>${trs}</tbody>
            </table>`;
        }

        function toggleAccordion(headerBtn) {
            const item = headerBtn.parentElement;
            const body = item.querySelector('.accordion-body');
            const isOpen = item.classList.contains('open');

            document.querySelectorAll('.accordion-item.open').forEach(openItem => {
                openItem.classList.remove('open');
                openItem.querySelector('.accordion-body').style.maxHeight = '0';
            });

            if (!isOpen) {
                item.classList.add('open');
                body.style.maxHeight = body.scrollHeight + 'px';
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
            openCartModal();
        }

        function updateCartUI() {
            const cartBar = document.getElementById('cartBar');
            const cartCount = document.getElementById('cartCount');
            const cartTotal = document.getElementById('cartTotal');
            const pdpOpen = document.getElementById('productView').style.display === 'block';

            if (cart.length > 0) {
                cartBar.style.display = pdpOpen ? 'none' : 'flex';
                cartCount.innerText = cart.length;
                const total = cart.reduce((sum, item) => sum + item.price, 0);
                cartTotal.innerText = `${total} грн`;
            } else {
                cartBar.style.display = 'none';
            }
        }

        function openCartModal() {
            const modal = document.getElementById('cartModal');
            const list = document.getElementById('cartItemsList');

            if (cart.length === 0) {
                list.innerHTML = '<div class="cart-empty">Кошик порожній</div>';
            } else {
                list.innerHTML = cart.map((item, index) => `
                    <div class="cart-item">
                        <div>
                            <div>${item.title}</div>
                            <div class="cart-item-meta">Розмір ${item.size} · ${item.sku}</div>
                        </div>
                        <div style="display:flex; align-items:center; gap:12px;">
                            <span>${item.price} грн</span>
                            <button class="cart-item-remove" onclick="removeFromCart(${index})">&times;</button>
                        </div>
                    </div>
                `).join('');
            }

            document.getElementById('submitBtn').disabled = cart.length === 0;
            modal.style.display = 'flex';
        }

        function closeCartModal() {
            document.getElementById('cartModal').style.display = 'none';
        }

        function submitOrder(e) {
            e.preventDefault();
            if (cart.length === 0) return;

            const orderData = {
                name: document.getElementById('custName').value,
                lastName: document.getElementById('custLastName').value,
                phone: document.getElementById('custPhone').value,
                city: document.getElementById('custCity').value,
                np: document.getElementById('custNP').value,
                items: cart,
                total: cart.reduce((sum, item) => sum + item.price, 0)
            };

            // TODO: замінити на реальну відправку (Telegram-бот / API / email)
            console.log('Нове замовлення:', orderData);

            alert("Дякуємо за замовлення! Менеджер зв'яжеться з вами найближчим часом.");
            cart = [];
            updateCartUI();
            closeCartModal();
        }
        let products = [];

        async function loadProducts() {
            try {
                const productFiles = [
                    'content/products/тест.json'
                ];

                const loaded = await Promise.all(
                    productFiles.map(async (file) => {
                        const res = await fetch('/' + file);
                        if (!res.ok) throw new Error('Не удалось загрузить ' + file);
                        const data = await res.json();

                        return {
                            ...data,
                            id: data.sku || data.title || Math.random().toString(36).slice(2),
                            images: (data.images || []).map(img => {
                                if (typeof img === 'string') {
                                    return img.startsWith('/') || img.startsWith('http') ? img : '/' + img;
                                }
                                if (img && img.image) {
                                    return img.image.startsWith('/') || img.image.startsWith('http') ? img.image : '/' + img.image;
                                }
                                return img;
                            })
                        };
                    })
                );

                products = loaded;
                console.log('Товары загружены:', products);
                renderProducts();
            } catch (err) {
                console.error('Ошибка загрузки товаров:', err);
                products = [];
                renderProducts();
            }
        }

        // Запускаем загрузку
        loadProducts();
        
    </script>
</body>
</html>
